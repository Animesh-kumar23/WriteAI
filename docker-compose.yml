# ─────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT STACK
#
# Starts: Express backend + Vite frontend + MongoDB + Redis
#
# Setup:
#   1. Copy .env.example to .env and fill in your secrets.
#   2. docker compose up --build
#
# URLs once running:
#   Frontend  → http://localhost:5173
#   Backend   → http://localhost:3000
#   MongoDB   → localhost:27017
#   Redis     → localhost:6379
#
# To stop:  docker compose down
# To wipe all data:  docker compose down -v
# ─────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db     # data lives in a named volume, not inside the container
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend          # uses backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      # Inside compose, service hostnames are the service names (mongo, redis).
      # These override any localhost URLs you have in backend/.env.
      DB_URI: mongodb://mongo:27017/writeai
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      # Secrets come from your root .env file (docker-compose reads it automatically)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./backend/src:/app/src    # mount source so Node's --watch picks up edits
      - uploads:/app/uploads      # persist avatar / cover image uploads
      - /app/node_modules         # keep container's node_modules separate from host
    # Override the npm dev script (which expects a .env file) with a plain watcher
    command: node --watch ./src/server.js
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Vite dev server ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend         # uses frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      # Vite's file watcher needs polling inside Docker on most systems
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src   # mount source for HMR
      - /app/node_modules
    depends_on:
      - backend

# ── Named volumes ─────────────────────────────────────────────
# Named volumes persist across `docker compose down`.
# Use `docker compose down -v` to delete them along with containers.
volumes:
  mongo_data:
  redis_data:
  uploads:
