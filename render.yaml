## Render Blueprint — https://render.com/docs/blueprint-spec
##
## Backend-only Web Service. The React frontend is deployed separately on Vercel.
##
## Deploy steps:
##   1. Go to https://dashboard.render.com/new/blueprint
##   2. Connect Animesh-kumar23/WriteAI repo → Render detects this file.
##   3. Fill in the four "sync: false" secret vars in the Environment tab
##      before the first deploy finishes.

services:
  - type: web
    name: writeai
    runtime: node
    region: oregon
    plan: free

    # ── Build ──────────────────────────────────────────────────────────
    # Install pnpm, then install only production backend deps.
    buildCommand: npm install -g pnpm && cd backend && pnpm install --prod

    # ── Start ─────────────────────────────────────────────────────────
    startCommand: node backend/src/server.js

    # ── Health check ──────────────────────────────────────────────────
    # 401 is a valid HTTP response (not a crash) — Render marks it healthy.
    healthCheckPath: /api/auth/me

    # ── Environment variables ─────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production

      # CORS origin — must match your Vercel frontend URL exactly.
      - key: CLIENT_URL
        value: https://writeai.vercel.app

      # ── Secrets — set these in the Render dashboard ─────────────────
      # Dashboard → writeai → Environment → Add Environment Variable
      - key: DB_URI
        sync: false   # mongodb+srv://animeshkumar23:<pass>@cluster0...

      - key: JWT_SECRET_KEY
        sync: false   # 128-char hex secret

      - key: GEMINI_API_KEY
        sync: false   # AIzaSy... from Google AI Studio

      - key: REDIS_URL
        sync: false   # redis://default:<pass>@...redis.io:17550
