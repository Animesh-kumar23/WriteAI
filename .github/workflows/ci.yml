name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_URI: mongodb://127.0.0.1:27017/writeai_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET_KEY: writeai-ci-test-secret-not-for-production
      GEMINI_API_KEY: writeai-ci-dummy-key-no-api-calls
      CLIENT_URL: http://localhost:5173
      AI_DAILY_LIMIT: 1
      RAG_ENABLED: "false"
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --dir backend test

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build
