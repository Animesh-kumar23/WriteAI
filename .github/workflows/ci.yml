name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_URI: mongodb://127.0.0.1:27017/writeai_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET_KEY: writeai-ci-test-secret-not-for-production
      GEMINI_API_KEY: writeai-ci-dummy-key-no-api-calls
      CLIENT_URL: http://localhost:5173
      AI_DAILY_LIMIT: 1
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --dir backend test

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build

  # Build the production image here on the runner, not on the server. The
  # free-tier EC2 box has a small disk, and assembling Docker layers needs
  # several gigabytes of scratch space it does not have — that is what used to
  # fail the deploy with "no space left on device". GitHub's runner has room to
  # spare and throws it away afterwards, so the server only ever has to
  # download a finished image.
  image:
    name: Build and push image
    needs: test
    if: github.ref == 'refs/heads/aws-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: the commit SHA, so a deploy is pinned to exactly this build
      # and a rollback is a real thing you can point at, and `latest` for
      # pulling by hand when debugging. The registry path must be lowercase.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/animesh-kumar23/writeai:${{ github.sha }}
            ghcr.io/animesh-kumar23/writeai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous Deployment: pull the image built above and restart the container.
  # The server builds nothing and no longer needs a copy of the repo.
  deploy:
    name: Deploy to AWS EC2
    needs: image
    if: github.ref == 'refs/heads/aws-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/animesh-kumar23/writeai:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -e

            echo "=== disk before ==="
            df -h /
            docker system df
            sudo du -xh -d1 / 2>/dev/null | sort -h | tail -8 || true

            # A full disk is what breaks deploys on a free-tier box, so reclaim
            # the things that regrow on their own and nothing that does not.
            #
            # ~/WriteAI is a leftover checkout from when the server built the
            # image itself. The pipeline no longer uses it, and the old deploy
            # script ran `git reset --hard` over it every time, so it never held
            # anything of its own. The env file lives at ~/writeai.env, outside
            # that directory, and is not touched.
            rm -rf ~/WriteAI

            # Container logs are unbounded by default and are the usual reason a
            # box that was fine last month is full this month.
            sudo truncate -s 0 /var/lib/docker/containers/*/*-json.log 2>/dev/null || true
            sudo journalctl --vacuum-size=50M 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true

            # Stopped containers, and images no container is using. Volumes are
            # never pruned: they hold uploaded avatars and cover images.
            docker container prune -f
            docker image prune -af

            echo "=== disk after ==="
            df -h /

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            # Remember what is serving right now so a bad rollout can go back.
            PREVIOUS=$(docker inspect --format='{{.Image}}' writeai 2>/dev/null || echo "")

            # Download first, swap second. The running container keeps serving
            # during the pull, so if the pull fails the site is left untouched.
            docker pull "$IMAGE"

            start_container() {
              docker rm -f writeai 2>/dev/null || true
              docker run -d --name writeai -p 80:3000 \
                --env-file ~/writeai.env \
                -v writeai_uploads:/app/backend/uploads \
                --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=3 \
                "$1"
            }

            start_container "$IMAGE"

            for attempt in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' writeai 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                # The old image is now unused, so this is what keeps the small
                # disk from filling up again over time.
                docker image prune -af
                docker logout ghcr.io
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            # The new image never came up healthy. Put the previous one back and
            # fail the job, rather than leaving a broken container running and
            # reporting success.
            echo "New image did not become healthy."
            docker logs --tail 50 writeai || true

            if [ -n "$PREVIOUS" ]; then
              echo "Rolling back to $PREVIOUS"
              start_container "$PREVIOUS"
            fi

            docker logout ghcr.io
            exit 1
