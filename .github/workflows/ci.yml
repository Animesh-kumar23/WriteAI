name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_URI: mongodb://127.0.0.1:27017/writeai_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET_KEY: writeai-ci-test-secret-not-for-production
      GEMINI_API_KEY: writeai-ci-dummy-key-no-api-calls
      CLIENT_URL: http://localhost:5173
      AI_DAILY_LIMIT: 1
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --dir backend test

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Build frontend
        run: pnpm --dir frontend build

  # Continuous Deployment: after tests pass on the aws-deploy branch, SSH into
  # the EC2 box and rebuild the container. Other branches/PRs run tests only.
  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/aws-deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/WriteAI
            git fetch origin aws-deploy
            git reset --hard origin/aws-deploy
            docker build -t writeai:next .
            docker stop writeai || true
            docker rm writeai || true
            docker run -d --name writeai -p 80:3000 \
              --env-file ~/writeai.env \
              -v writeai_uploads:/app/backend/uploads \
              --restart unless-stopped \
              writeai:next

            for attempt in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' writeai)
              if [ "$status" = "healthy" ]; then
                docker tag writeai:next writeai
                docker image rm writeai:next
                docker image prune -f
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            docker logs writeai
            docker rm -f writeai
            if docker image inspect writeai >/dev/null 2>&1; then
              docker run -d --name writeai -p 80:3000 \
                --env-file ~/writeai.env \
                -v writeai_uploads:/app/backend/uploads \
                --restart unless-stopped \
                writeai
            fi
            exit 1
